<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主题名</title>
<meta name="description" content="一句话说明本页讲什么（类目页会显示）">
<!--
  learn 学习页骨架。复制后改成自己的内容，约定见 .claude/rules/learn-html.md：
  - 顶部导航条（回首页 / 类目 / 标题 / 全局「重置」）由 npm run build 自动插入 body 开头，这里不要自己写。
  - --up-* 变量（背景、文字、边框、字体、类目主色 --up-accent）也随导航条注入，页面只引用、不重定义。
  - 每个模块提供 reset() 并 push 进 resets；window.pageReset 依次调用，练习组件再把它包成 window.resetPage。
-->
<style>
/* ---------- 页面变量：中性色映射到站点变量，只为内容另加语义色 ---------- */
:root{
  --bg:var(--up-bg); --surface:var(--up-surface); --ink:var(--up-ink); --muted:var(--up-muted); --line:var(--up-line);
  --accent:var(--up-accent); --ok:var(--up-ok); --bad:var(--up-bad);
  --c1:#1c7ed6; --c2:#e8590c;           /* 内容语义色示例：对比的两样东西 */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --c1:#74c0fc; --c2:#ffa94d; }
}
:root[data-theme="dark"]{ --c1:#74c0fc; --c2:#ffa94d; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--up-font);padding:24px 16px 96px}
main{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:48px}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.25;margin:0 0 8px}
h2{font-size:1.4rem;margin:0 0 8px}
p{margin:0}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--up-radius);box-shadow:var(--up-shadow);padding:16px}
.analogy{border-left:4px solid var(--accent)}
.btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--up-surface)}
.btn:disabled{opacity:.45;cursor:default}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.stepno{font-family:var(--up-mono);color:var(--muted);font-size:.9rem;min-width:56px;text-align:center}
.stage{height:160px;border-radius:10px;background:var(--up-surface-2);position:relative;overflow:hidden;margin-top:12px}
.ball{position:absolute;top:60px;left:16px;width:40px;height:40px;border-radius:50%;background:var(--c1);transition:left .8s ease,background .8s}
.caption{min-height:3.4em;margin-top:10px}
@media (prefers-reduced-motion: reduce){.ball{transition:none}}

:root{--lq-surface:var(--surface);--lq-ink:var(--ink);--lq-muted:var(--muted);--lq-line:var(--line);--lq-accent:var(--accent);--lq-ok:var(--ok);--lq-bad:var(--bad)}
/* ---------- 练习题（learn 通用组件，颜色由上方 --lq-* 映射） ---------- */
.lq{display:grid;gap:12px;margin-bottom:56px}
.lq-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 16px}
.lq-head h2{margin:0;font-size:var(--lq-h2,22px);letter-spacing:normal;color:var(--lq-ink);text-transform:none}
.lq-sub{margin:0;color:var(--lq-muted);font-size:14px}
.lq-score{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--lq-muted);font-variant-numeric:tabular-nums}
.lq-list{display:grid;gap:10px}
.lq-item{background:var(--lq-surface);border:1.5px solid var(--lq-line);border-radius:10px;padding:12px 16px;display:grid;gap:10px;min-width:0;color:var(--lq-ink);text-align:left}
.lq-item.lq-is-ok{border-color:var(--lq-ok)}
.lq-item.lq-is-bad{border-color:var(--lq-bad)}
.lq-q{font-size:15px;font-weight:600;line-height:1.6}
.lq-tag{display:inline-block;font-size:11px;font-weight:500;line-height:1.6;color:var(--lq-muted);border:1px solid var(--lq-line);border-radius:999px;padding:0 8px;margin-right:8px;vertical-align:1px}
.lq-opts,.lq-fill{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lq .lq-opt,.lq .lq-redo{font:inherit;font-size:14px;line-height:1.4;padding:6px 14px;margin:0;border-radius:8px;border:1.5px solid var(--lq-line);background:transparent;color:var(--lq-ink);cursor:pointer;text-align:left;opacity:1}
.lq .lq-opt:hover:not(:disabled),.lq .lq-redo:hover{border-color:var(--lq-accent)}
.lq .lq-opt:disabled{cursor:default;opacity:1}
.lq .lq-opt.lq-right{border-color:var(--lq-ok);color:var(--lq-ok);font-weight:700}
.lq .lq-opt.lq-wrong{border-color:var(--lq-bad);color:var(--lq-bad);text-decoration:line-through}
.lq-fill input{font:inherit;font-size:14px;padding:6px 10px;margin:0;border-radius:8px;border:1.5px solid var(--lq-line);background:transparent;color:var(--lq-ink);width:min(100%,200px)}
.lq-fill input.lq-right{border-color:var(--lq-ok)}
.lq-fill input.lq-wrong{border-color:var(--lq-bad)}
.lq-why{font-size:14px;line-height:1.65;color:var(--lq-muted)}
.lq-why:empty{display:none}
.lq-why .lq-ok{color:var(--lq-ok)}
.lq-why .lq-bad{color:var(--lq-bad)}
</style>
</head>
<body>
<main>

<section>
  <h1>主题名</h1>
  <p class="lead">一两句话说清楚这一页要解决什么疑问。</p>
</section>

<section class="card analogy">
  <b>生活比喻：……</b><br>用一个熟悉的场景建立直觉。
</section>

<!-- 分步动画模块：上一步 / 下一步 / 播放 + 局部重置 -->
<section>
  <h2>一步一步看</h2>
  <div class="card" id="demo">
    <div class="stage"><div class="ball"></div></div>
    <p class="caption"></p>
    <div class="ctrl">
      <button type="button" class="btn" data-act="prev">◀ 上一步</button>
      <span class="stepno"></span>
      <button type="button" class="btn" data-act="next">下一步 ▶</button>
      <button type="button" class="btn primary" data-act="play">▶ 播放</button>
      <button type="button" class="btn" data-act="reset">↺ 重置本模块</button>
    </div>
  </div>
</section>

<section class="lq" id="lq" aria-label="练习">
  <div class="lq-head"><h2>练习</h2><span class="lq-score"></span></div>
  <p class="lq-sub">学完上面的内容，来检验一下。每题作答后马上看到解析；点「重做练习」清空重来。</p>
  <div class="lq-list"></div>
  <div><button type="button" class="lq-redo">↻ 重做练习</button></div>
</section>

</main>

<script>
const resets = [];                                   // 每个模块的 reset()
window.pageReset = () => resets.forEach(f => f());   // 练习组件会把它包进 window.resetPage

/* ---------- 分步动画模块 ---------- */
{
  const root = document.getElementById('demo');
  const ball = root.querySelector('.ball'), cap = root.querySelector('.caption'), no = root.querySelector('.stepno');
  const btn = act => root.querySelector(`[data-act="${act}"]`);
  const STEPS = [
    { left: '16px', color: 'var(--c1)', text: '第 1 步：初始状态。' },
    { left: '40%', color: 'var(--c1)', text: '第 2 步：发生了什么。' },
    { left: 'calc(100% - 56px)', color: 'var(--c2)', text: '第 3 步：结果，以及为什么。' },
  ];
  const INIT = { step: 0, playing: false };          // 初始值只写这一处
  let S = { ...INIT }, timer = null;
  const draw = () => {
    const s = STEPS[S.step];
    ball.style.left = s.left; ball.style.background = s.color;
    cap.textContent = s.text; no.textContent = `${S.step + 1} / ${STEPS.length}`;
    btn('prev').disabled = S.step === 0; btn('next').disabled = S.step === STEPS.length - 1;
    btn('play').textContent = S.playing ? '⏸ 暂停' : '▶ 播放';
  };
  const stop = () => { clearInterval(timer); timer = null; S.playing = false; };
  const go = d => { S.step = Math.max(0, Math.min(STEPS.length - 1, S.step + d)); draw(); };
  btn('prev').onclick = () => { stop(); go(-1); };
  btn('next').onclick = () => { stop(); go(1); };
  btn('play').onclick = () => {
    if (S.playing) { stop(); draw(); return; }
    if (S.step === STEPS.length - 1) S.step = 0;
    S.playing = true; draw();
    timer = setInterval(() => { go(1); if (S.step === STEPS.length - 1) { stop(); draw(); } }, 1200);
  };
  const reset = () => { stop(); S = { ...INIT }; draw(); };
  btn('reset').onclick = reset;
  resets.push(reset);
  reset();
}

/* ---------- 练习题数据：至少 5 道，由易到难，含常见误区题和迁移应用题 ---------- */
window.LQ_ITEMS = [
  { type: '选择', q: '题目……', opts: ['选项 A', '选项 B', '选项 C'], ans: 0, why: '解析：为什么对，错的错在哪。' },
  { type: '判断', q: '一个常见误区的说法。', opts: ['对', '错'], ans: 1, why: '解析……（可引用上面动画的第几步）' },
  { type: '填空', q: '答案是？', ans: ['标准答案', '可接受的写法'], placeholder: '输入答案', why: '解析……' },
];
</script>
<script>
/* ---------- 练习题（learn 通用组件） ----------
   题目来自 window.LQ_ITEMS：{type, q, opts, ans: 选项下标, why} 或填空题 {type, q, ans: [可接受答案…], why}
   定义 window.resetPage()（导航条「重置」按钮调用）：先调用页面自己的 window.pageReset()，再清空练习 */
(() => {
  const box = document.getElementById('lq');
  const items = window.LQ_ITEMS || [];
  const list = box.querySelector('.lq-list'), score = box.querySelector('.lq-score');
  const norm = s => String(s).trim().toLowerCase().replace(/[−–—]/g, '-').replace(/\s+/g, '');
  let answered = 0, right = 0;

  function update() {
    const all = answered === items.length;
    score.textContent = `已答 ${answered} / ${items.length} · 答对 ${right}` +
      (all ? (right === items.length ? ' · 全对！' : ' · 看看解析，再重做一次') : '');
  }

  function render() {
    answered = 0; right = 0; list.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'lq-item';
      el.innerHTML = `<div class="lq-q"><span class="lq-tag">${it.type}</span>${i + 1}. ${it.q}</div><div class="lq-a"></div><div class="lq-why"></div>`;
      const a = el.querySelector('.lq-a'), why = el.querySelector('.lq-why');
      const judge = (ok, answer) => {
        answered++; if (ok) right++;
        el.classList.add(ok ? 'lq-is-ok' : 'lq-is-bad');
        why.innerHTML = (ok ? '<b class="lq-ok">✓ 正确。</b>' : `<b class="lq-bad">✗ 不对，正确答案：${answer}。</b>`) + it.why;
        update();
      };
      if (it.opts) {
        a.classList.add('lq-opts');
        it.opts.forEach((o, j) => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'lq-opt'; b.innerHTML = o;
          b.onclick = () => {
            a.querySelectorAll('button').forEach(x => x.disabled = true);
            a.children[it.ans].classList.add('lq-right');
            if (j !== it.ans) b.classList.add('lq-wrong');
            judge(j === it.ans, it.opts[it.ans]);
          };
          a.append(b);
        });
      } else {
        a.classList.add('lq-fill');
        a.innerHTML = `<input type="text" autocomplete="off" spellcheck="false" placeholder="${it.placeholder || '输入答案'}" aria-label="第 ${i + 1} 题答案"><button type="button" class="lq-opt">确定</button>`;
        const inp = a.querySelector('input'), go = a.querySelector('button');
        const submit = () => {
          if (!inp.value.trim()) { inp.focus(); return; }
          inp.disabled = go.disabled = true;
          const ok = it.ans.some(x => norm(x) === norm(inp.value));
          inp.classList.add(ok ? 'lq-right' : 'lq-wrong');
          judge(ok, it.ans[0]);
        };
        go.onclick = submit;
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      }
      list.append(el);
    });
    update();
  }

  box.querySelector('.lq-redo').addEventListener('click', render);
  // 导航条的「重置」按钮调用它：页面各模块 + 练习题一起恢复初始状态
  window.resetPage = () => {
    if (typeof window.pageReset === 'function') window.pageReset();
    render();
  };
  render();
})();
</script>
</body>
</html>
